name: TikTok рубежи

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Прислать тестовое сообщение"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tiktok-milestones
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить yt-dlp
        run: pip install -q -U yt-dlp

      - name: Загрузить память бота
        run: |
          if git fetch --depth=1 origin bot-state 2>/dev/null; then
            git show FETCH_HEAD:state.json > /tmp/state.json
          else
            echo '{}' > /tmp/state.json
          fi

      - name: Проверить видео и отправить уведомления
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TIKTOK_ACCOUNTS: ${{ secrets.TIKTOK_ACCOUNTS }}
          TIKTOK_VIDEO: ${{ secrets.TIKTOK_VIDEO }}
          TEST: ${{ github.event.inputs.test }}
        run: python bot/check.py /tmp/state.json

      - name: Опубликовать статистику для приложения
        run: |
          git config user.name "kassa-bot"
          git config user.email "kassa-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -qm "Обновление статистики"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: Сохранить память бота
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/st && cd /tmp/st
          git init -q
          git checkout -q -b bot-state
          cp /tmp/state.json state.json
          git config user.name "kassa-bot"
          git config user.email "kassa-bot@users.noreply.github.com"
          git add state.json
          git commit -qm "state"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bot-state
