<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>TikTok Касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: одна колонка-телефон, сводка дохода сверху, тонкие строки роликов, нижний таб-бар и выезжающие шторки */
:root{
  --bg:#F3F2F7; --surface:#FFFFFF; --surface-2:#EAE8F1; --line:#DCD9E6;
  --fg:#17151F; --muted:#6C6880; --faint:#9C98AE;
  --views:#3B5BFF; --money:#C98A06; --money-soft:#FFF1CF; --views-soft:#E3E8FF;
  --ok:#14995A; --ok-soft:#DDF5E8; --wait:#C26A00; --wait-soft:#FFEBD2; --bad:#D6334B;
  --shadow:0 10px 30px -12px rgba(40,30,90,.25);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0D14; --surface:#18161F; --surface-2:#221F2C; --line:#2E2A3B;
  --fg:#F2F0F8; --muted:#A19CB4; --faint:#6E6984;
  --views:#7D92FF; --money:#FFC24B; --money-soft:#33280E; --views-soft:#1D2142;
  --ok:#3FD58B; --ok-soft:#10301F; --wait:#FFA640; --wait-soft:#33220C; --bad:#FF6680;
  --shadow:0 14px 40px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D14; --surface:#18161F; --surface-2:#221F2C; --line:#2E2A3B;
  --fg:#F2F0F8; --muted:#A19CB4; --faint:#6E6984;
  --views:#7D92FF; --money:#FFC24B; --money-soft:#33280E; --views-soft:#1D2142;
  --ok:#3FD58B; --ok-soft:#10301F; --wait:#FFA640; --wait-soft:#33220C; --bad:#FF6680;
  --shadow:0 14px 40px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--views);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--money);box-shadow:5px 5px 0 var(--views);margin-right:6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;position:relative}
.seg button{position:relative;z-index:1;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .35s cubic-bezier(.3,1.4,.5,1),width .35s}

/* сводка */
.hero{background:var(--surface);border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--money-soft),transparent 70%);pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,9vw,40px);letter-spacing:-.03em;margin:6px 0 2px;line-height:1.05;position:relative;z-index:1}
.sub{color:var(--muted);font-size:13px;position:relative;z-index:1}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.split div{background:var(--surface-2);border-radius:12px;padding:9px 10px;min-width:0}
.split b{display:block;font-family:var(--f-mono);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split span{font-size:11px;color:var(--muted);font-weight:600}
.split .s-paid b{color:var(--ok)} .split .s-sub b{color:var(--wait)}

/* чипы проектов */
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;transition:all .2s;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{opacity:.6;margin-left:4px;font-family:var(--f-mono)}

.rowhead{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px}
.rowhead h2{font-family:var(--f-display);font-weight:500;font-size:14px;margin:0;letter-spacing:.01em}
.link{color:var(--views);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.link svg{transition:transform .6s}
.link.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* карточки видео */
.list{display:flex;flex-direction:column;gap:8px}
.vid{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.list.anim .vid{animation:rise .5s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:.001}}
.vmain{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;width:100%;text-align:left;align-items:center}
.vt{min-width:0}
.vt .ttl{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.vt .ttl em{font-style:normal;color:var(--faint)}
.kpis{display:flex;align-items:baseline;gap:14px;margin-top:3px}
.kv{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.kv small{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--muted);margin-left:3px;letter-spacing:0}
.er{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--views)}
.er.hi{color:var(--ok)}
.vr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.money{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--money)}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;transition:background .3s,color .3s}
.st.submitted{background:var(--wait-soft);color:var(--wait)}
.st.paid{background:var(--ok-soft);color:var(--ok)}
.st.ready{background:var(--views-soft);color:var(--views)}
.vmore{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.vid.open .vmore{grid-template-rows:1fr}
.vmore>div{overflow:hidden}
.vin{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border-top:1px dashed var(--line);padding-top:12px}
.mini div{text-align:center;min-width:0}
.mini b{display:block;font-family:var(--f-mono);font-size:13px;font-weight:600}
.mini span{font-size:10px;color:var(--muted);font-weight:600}
.stseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stseg button{padding:9px 4px;border-radius:10px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);transition:all .2s}
.stseg button[aria-pressed="true"].none{background:var(--fg);color:var(--bg)}
.stseg button[aria-pressed="true"].submitted{background:var(--wait);color:#fff}
.stseg button[aria-pressed="true"].paid{background:var(--ok);color:#fff}
.vact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vact select{flex:1;min-width:120px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.ib{padding:9px 12px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:12px}
.ib.danger{color:var(--bad)}
.meta{font-size:11px;color:var(--faint)}

.empty{text-align:center;padding:36px 20px;color:var(--muted);background:var(--surface);border-radius:var(--r);border:1px dashed var(--line)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:500;margin-bottom:6px}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--views-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:12px;margin-top:12px}
.demo button{font-weight:700;color:var(--views);white-space:nowrap}

/* FAB и таббар */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.3,1.6,.5,1);z-index:20}
.fab:active{transform:scale(.9) rotate(90deg)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:12px;font-size:11px;font-weight:700;color:var(--faint);transition:color .2s}
.tabs button[aria-pressed="true"]{color:var(--fg)}
.tabs button[aria-pressed="true"] svg{transform:translateY(-2px)}
.tabs svg{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}

.view{animation:viewIn .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes viewIn{from{opacity:.001;transform:translateX(var(--dx,12px))}}

/* аналитика */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kcard b{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard.m b{color:var(--money)} .kcard.v b{color:var(--views)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.panel h3{margin:0 0 10px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chart{width:100%;height:auto;display:block}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes grow{from{transform:scaleY(0)}}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin-bottom:12px;font-size:13px}
.hbar .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .fill{height:100%;border-radius:99px;background:var(--money);transform-origin:left;animation:growx .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.hbar span:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}

/* настройки */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:15px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--views)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:700;font-size:15px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0 12px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.proj{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.proj:last-of-type{border-bottom:0}
.proj .pn{flex:1;min-width:0}
.proj .pn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .pn span{font-size:12px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:4px;flex:none}

/* шторка */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.95,.25,1);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.on{transform:none}
.sheet-in{max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:88vh;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0 0 14px}
.err{color:var(--bad);font-size:13px;margin:-4px 0 12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:60;transition:all .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mstone{display:flex;flex-direction:column;gap:6px}
.mstone>div:first-child{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.mstone b{color:var(--fg)}
.mtrack{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mtrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--views),var(--money));transform-origin:left;animation:growx .8s cubic-bezier(.2,.9,.3,1) both}
.ava.sm{width:34px;height:34px;border-radius:10px;font-size:14px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--faint);margin-left:2px;transition:background .3s}
.sdot[data-s="ok"]{background:var(--ok)} .sdot[data-s="pending"],.sdot[data-s="loading"]{background:var(--wait);animation:pulse 1s ease-in-out infinite} .sdot[data-s="error"]{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.acct{display:flex;align-items:center;gap:12px}
.acct .pn b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .pn span{font-size:12px;color:var(--muted)}
.ava{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--views-soft);color:var(--views)}
.sync{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.sync[data-s="ok"]{color:var(--ok)} .sync[data-s="error"]{color:var(--bad)} .sync[data-s="pending"],.sync[data-s="loading"]{color:var(--wait)}
.panel .seg{display:flex} .panel .seg button{flex:1}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .45s,color .45s,border-color .45s,fill .45s!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>

<body>

<div class="wrap" id="app"></div>
<button class="fab" id="fab" aria-label="Добавить видео"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="tabs"><nav id="tabs">
  <button data-tab="videos" aria-pressed="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>Видео</button>
  <button data-tab="stats" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>Аналитика</button>
  <button data-tab="settings" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
</nav></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
if (TG){ try{ TG.ready(); TG.expand(); TG.onEvent("themeChanged",()=>applyTheme()); }catch(e){} }
const hostTheme=document.documentElement.getAttribute("data-theme");
const haptic = (t)=>{ try{ TG && TG.HapticFeedback && (t==="ok"?TG.HapticFeedback.notificationOccurred("success"):TG.HapticFeedback.impactOccurred(t||"light")); }catch(e){} };

const USER = TG && TG.initDataUnsafe && TG.initDataUnsafe.user ? TG.initDataUnsafe.user : null;
const CLOUD = !!(TG && TG.CloudStorage && USER && (!TG.isVersionAtLeast || TG.isVersionAtLeast("6.9")));
const BASEKEY="ttkassa.v1", KEY=BASEKEY+(USER?"."+USER.id:"");
const DAY=864e5, now=Date.now();
const PALETTE=["#3B5BFF","#E0A100","#14995A","#D6334B","#8A4DFF","#0FA3B1"];
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- облако Telegram: данные привязаны к аккаунту ---------- */
let syncState = CLOUD? "loading" : "local", syncAt=0;
const cs = CLOUD? TG.CloudStorage : null;
const cget=(keys)=>new Promise((res,rej)=>cs.getItems(keys,(e,v)=>e?rej(e):res(v||{})));
const cset=(k,v)=>new Promise((res,rej)=>cs.setItem(k,v,(e,ok)=>e?rej(e):res(ok)));
const cdel=(keys)=>new Promise((res)=>keys.length?cs.removeItems(keys,()=>res()):res());
const CH=3500; let cloudMeta=null, cloudTimer=null, pushing=false, again=false;
function scheduleCloud(){ if(!CLOUD||S.demo||syncState==="loading") return; clearTimeout(cloudTimer); syncState="pending"; updSync(); cloudTimer=setTimeout(pushCloud,900); }
async function pushCloud(){
  if(!CLOUD||S.demo) return; if(pushing){ again=true; return; } pushing=true;
  try{
    const data=JSON.stringify(S), parts=[];
    for(let i=0;i<data.length;i+=CH) parts.push(data.slice(i,i+CH));
    const g = cloudMeta&&cloudMeta.g==="a" ? "b" : "a";            // пишем в свободный слот, старый не трогаем до конца
    for(let i=0;i<parts.length;i++) await cset(g+i,parts[i]);
    const old=cloudMeta; cloudMeta={g,n:parts.length,ts:S.ts};
    await cset("meta",JSON.stringify(cloudMeta));
    if(old){ const k=[]; for(let i=0;i<old.n;i++) if(old.g!==g||i>=parts.length) k.push(old.g+i); await cdel(k); }
    syncState="ok"; syncAt=Date.now();
  }catch(e){ syncState="error"; }
  pushing=false; updSync(); if(again){ again=false; pushCloud(); }
}
async function pullCloud(){
  if(!CLOUD) return;
  try{
    const m=await cget(["meta"]);
    if(m.meta){
      cloudMeta=JSON.parse(m.meta);
      if(S.demo || cloudMeta.ts>(S.ts||0)){
        const keys=[...Array(cloudMeta.n)].map((_,i)=>cloudMeta.g+i), got={};
        for(let i=0;i<keys.length;i+=40) Object.assign(got, await cget(keys.slice(i,i+40)));
        const d=JSON.parse(keys.map(k=>got[k]||"").join(""));
        if(Array.isArray(d.videos)){ S=normalize(d); S.demo=false; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
      }
    }
    syncState="ok"; syncAt=Date.now();
    if(!S.demo && (!cloudMeta || (S.ts||0)>cloudMeta.ts)) { syncState="pending"; pushCloud(); }
  }catch(e){ syncState="error"; }
  applyTheme(); animNext=true; render(); autoImport();
}
function syncText(){
  if(!CLOUD) return TG? "Обнови Telegram, чтобы включить облачное сохранение." : "Открыто не в Telegram — данные хранятся только в этом браузере.";
  return {loading:"Загружаю данные из облака…",pending:"Сохраняю…",ok:"Сохранено в облаке Telegram"+(syncAt?" · "+new Date(syncAt).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):""),error:"Не удалось сохранить в облако. Данные есть на устройстве, попробуй ещё раз."}[syncState];
}
function updSync(){ const el=document.getElementById("syncTxt"); if(el){ el.textContent=syncText(); el.dataset.s=syncState; } const d=document.getElementById("syncDot"); if(d) d.dataset.s=CLOUD?syncState:"local"; }

  else r.setAttribute("data-theme",t);

const incomeUSD=(v)=>{const p=proj(v.projectId); return p? (v.stats.views/1000)*p.rate : 0;};
const nf=(n,d=0)=>Number(n||0).toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
function money(usd, cur){ cur=cur||S.currency; return cur==="USD" ? "$"+nf(usd,2) : nf(usd*fxRate(), usd*fxRate()<100?2:0)+" ₽"; }
function short(n){ n=+n||0; if(n>=1e6) return nf(n/1e6,n>=1e7?0:1)+"M"; if(n>=1e4) return nf(n/1e3,0)+"K"; if(n>=1e3) return nf(n/1e3,1)+"K"; return nf(n); }

/* ---------- TikTok ---------- */
function cleanUrl(u){ u=(u||"").trim(); const m=u.match(/https?:\/\/\S+/); return m?m[0]:u; }
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
/* запрос к tikwm: 4 попытки, по очереди GET и POST, с паузами (бесплатный лимит ~1 запрос/сек) */
let lastCall=0;
async function tikwm(path,params){
  let msg="";
  for(let a=0;a<4;a++){
    const wait=lastCall+1300-Date.now(); if(wait>0) await sleep(wait);
    lastCall=Date.now();
    try{
      const q=new URLSearchParams(params);
      const r= a%2===0 ? await fetch("https://www.tikwm.com/api/"+path+"?"+q.toString())
                       : await fetch("https://www.tikwm.com/api/"+path,{method:"POST",body:q});
      const j=await r.json();
      if(j.code===0&&j.data) return j.data;
      msg=j.msg||"пустой ответ";
      if(/not exist|invalid|private|не существ/i.test(msg)) break;
    }catch(e){ msg="нет связи с сервисом статистики"; }
    await sleep(1500+a*1000);
  }
  throw new Error(msg);
}
async function fetchTT(url){
  const d=await tikwm("",{url,hd:0});
  return {id:d.id,title:d.title||"Без описания",author:(d.author&&(d.author.unique_id||d.author.nickname))||"",created:(d.create_time||0)*1000,
    stats:{views:+d.play_count||0,likes:+d.digg_count||0,comments:+d.comment_count||0,shares:+d.share_count||0,favorites:+d.collect_count||0,saves:+d.download_count||0}};
}
let refreshing=false;
function mapPost(d){ return {tid:String(d.video_id||d.id||""),title:d.title||"Без описания",created:(d.create_time||0)*1000,
  stats:{views:+d.play_count||0,likes:+d.digg_count||0,comments:+d.comment_count||0,shares:+d.share_count||0,favorites:+d.collect_count||0,saves:+d.download_count||0}}; }
async function fetchPosts(user,pages){
  const out=[]; let cursor=0;
  for(let p=0;p<pages;p++){
    let d; try{ d=await tikwm("user/posts",{unique_id:user,count:30,cursor}); }catch(e){ if(p===0) throw e; break; }
    out.push(...(d.videos||[]).map(mapPost).filter(x=>x.tid));
    if(!d.hasMore) break; cursor=d.cursor;
  }
  return out;
}
/* статистика с сервера GitHub (бот кладёт data.json рядом с приложением) */
async function fetchServer(){
  try{ const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return null; const j=await r.json(); return Array.isArray(j.videos)?j:null; }catch(e){ return null; }
}
function clearDemo(){ S.videos=S.videos.filter(x=>!x.demo); S.projects=S.projects.filter(p=>!/^Пример/.test(p.name)); S.demo=false; S.filter="all"; }
let importing=false;
async function importAccounts(silent){
  const res={added:0,updated:0,fail:0,ids:new Set()};
  if(importing||!S.accounts.length) return res;
  importing=true; if(S.demo) clearDemo(); render();
  const srv=await fetchServer(); if(srv) S.serverAt=srv.updated*1000;
  for(const a of S.accounts){
    try{
      const since=a.since? new Date(a.since).getTime() : 0;
      const lc=a.u.toLowerCase(); let posts;
      if(srv && (srv.accounts||[]).some(x=>String(x).toLowerCase()===lc)){
        posts=srv.videos.filter(v=>String(v.user).toLowerCase()===lc).map(v=>({tid:String(v.id),title:v.title||"Без описания",created:(v.created||0)*1000,
          stats:{views:v.s[0]||0,likes:v.s[1]||0,comments:v.s[2]||0,shares:v.s[3]||0,favorites:v.s[4]||0,saves:v.s[5]||0}}));
        if(!posts.length && srv.errors && srv.errors[a.u]) throw new Error("сервер не смог получить видео ("+srv.errors[a.u]+")");
        if(!posts.length) throw new Error("сервер ещё не собрал видео, подожди 15 минут");
      } else {
        try{ posts=await fetchPosts(a.u, a.lastImport?2:6); }
        catch(e){ throw new Error(e.message+(srv?". Добавь "+a.u+" в секрет TIKTOK_ACCOUNTS на GitHub":". Настрой бота на GitHub — тогда статистика пойдёт через него")); }
      }
      for(const p of posts){
        const v=S.videos.find(x=>x.tid===p.tid);
        if(v){ v.stats=p.stats; v.updated=Date.now(); if(!v.created) v.created=p.created; res.updated++; }
        else if(!since || p.created>=since){ S.videos.push({id:uid(),tid:p.tid,url:"https://www.tiktok.com/@"+a.u+"/video/"+p.tid,title:p.title,author:a.u,created:p.created||Date.now(),added:Date.now(),projectId:a.projectId||"",status:"none",stats:p.stats,updated:Date.now()}); res.added++; }
        res.ids.add(p.tid);
      }
      a.lastImport=Date.now();
    }catch(e){ res.fail++; res.err="@"+a.u+": "+(e.message||"ошибка"); }
    await sleep(1100);
  }
  importing=false; animNext=res.added>0; save(); render();
  if(!silent||res.added) toast(res.fail&&!res.updated&&!res.added? "Не удалось подгрузить "+res.err : res.added? `Новых видео: ${res.added}` : "Новых видео нет, статистика обновлена");
  if(res.added) haptic("ok");
  return res;
}
function autoImport(){ if(!S.accounts.length) return; const last=Math.min(...S.accounts.map(a=>a.lastImport||0)); if(Date.now()-last>10*60e3) importAccounts(true); }
async function refreshAll(){
  if(refreshing||importing) return;
  refreshing=true; render();
  const r=await importAccounts(true);
  const list=S.videos.filter(v=>!v.demo&&!v.manual&&!(v.tid&&r.ids.has(v.tid)));
  let ok=r.updated,fail=r.fail;
  for(const v of list){ try{ const d=await fetchTT(v.url); v.stats=d.stats; v.title=d.title; v.tid=v.tid||String(d.id||""); v.updated=Date.now(); ok++; save(); render(); }catch(e){fail++;} await sleep(1100); }
  refreshing=false; save(); render(); haptic("ok");
  toast((r.added?`Новых видео: ${r.added}. `:"")+(fail?`Обновлено ${ok}, не вышло ${fail}`:`Обновлено ${ok} видео`));
}
const BASE_MS=[3000,5000,10000,15000,20000,25000,30000,40000,50000,60000,70000,80000,90000,100000];
function nextMs(v){ for(const m of BASE_MS) if(m>v) return m; return 125000+Math.ceil(Math.max(0,v-125000+1)/25000)*25000; }
function prevMs(v){ if(v<3000) return 0; if(v<125000){ let p=0; for(const m of BASE_MS) if(m<=v) p=m; return p; } return 125000+Math.floor((v-125000)/25000)*25000; }

let tab="videos", openId=null, animNext=true;
const $=(s)=>document.querySelector(s);
const app=$("#app");
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),t.length>60?6000:2400); }

function countUp(el){
  const to=+el.dataset.to, fmt=el.dataset.fmt; if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=fmtv(to,fmt);return;}
  const from=+(el.dataset.from||0), t0=performance.now(), dur=900;
  el.textContent=fmtv(from,fmt);
  (function step(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4); el.textContent=fmtv(from+(to-from)*e,fmt); if(k<1) requestAnimationFrame(step); })(t0);
}
function fmtv(v,f){ return f==="money"? money(v) : f==="short"? short(v) : f==="pct"? nf(v,1)+"%" : nf(v); }
let lastTotal=0;

function segHTML(id,opts,val){ return `<div class="seg" data-seg="${id}"><span class="pill"></span>${opts.map(([k,l])=>`<button data-v="${k}" aria-pressed="${k===val}">${l}</button>`).join("")}</div>`; }
function placePills(){ document.querySelectorAll(".seg").forEach(s=>{ const b=s.querySelector('button[aria-pressed="true"]'), p=s.querySelector(".pill"); if(b&&p){ p.style.width=b.offsetWidth+"px"; p.style.transform=`translateX(${b.offsetLeft-3}px)`; } }); }

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tab===tab));
  $("#fab").hidden = tab!=="videos";
  if(tab==="videos") renderVideos(); else if(tab==="stats") renderStats(); else renderSettings();
  placePills();
  app.querySelectorAll("[data-to]").forEach(countUp);
}

  <div class="chips" role="group" aria-label="Проекты">

  <div class="list ${animNext?"anim":""}">${vids.length? vids.map(cardHTML).join("") : `<div class="empty"><b>Здесь пока пусто</b>Нажми «+» и вставь ссылку на видео из TikTok</div>`}</div>`;
  lastTotal=total; animNext=false;

function cardHTML(v,i){
  const p=proj(v.projectId), e=er(v.stats), inc=incomeUSD(v);
  const ready = v.status==="none" && p && p.threshold>0 && v.stats.views>=p.threshold;
  const below = v.status==="none" && p && p.threshold>0 && v.stats.views<p.threshold;
  const stLabel = ready? "Можно подать" : below? `До порога ${short(p.threshold-v.stats.views)}` : STATUS[v.status];
  const stCls = ready? "ready" : v.status;
  const s=v.stats;
  return `<article class="vid ${openId===v.id?"open":""}" style="--i:${i}" data-id="${v.id}">
    <button class="vmain" data-act="toggle" aria-expanded="${openId===v.id}">
      <div class="vt"><div class="ttl">${esc(v.title)} ${v.author?`<em>@${esc(v.author)}</em>`:""}</div>
        <div class="kpis"><span class="kv">${short(s.views)}<small>просм.</small></span><span class="er ${e>=10?"hi":""}">ER ${nf(e,1)}%</span></div></div>
      <div class="vr"><span class="money">${money(inc)}</span><span class="st ${stCls}">${stLabel}</span></div>
    </button>
    <div class="vmore"><div><div class="vin">
      <div class="mini">
        <div><b>${short(s.likes)}</b><span>Лайки</span></div>
        <div><b>${short(s.comments)}</b><span>Коммент.</span></div>
        <div><b>${short(s.shares)}</b><span>Репосты</span></div>
        <div><b>${short(s.favorites)}</b><span>Избранное</span></div>
        <div><b>${short(s.saves)}</b><span>Сохран.</span></div>
      </div>
      <div class="stseg" role="group" aria-label="Статус">${Object.entries(STATUS).map(([k,l])=>`<button class="${k}" data-status="${k}" aria-pressed="${v.status===k}">${l}</button>`).join("")}</div>
      <div class="vact">
        <select data-proj aria-label="Проект">${S.projects.map(pp=>`<option value="${pp.id}" ${pp.id===v.projectId?"selected":""}>${esc(pp.name)}</option>`).join("")}<option value="" ${!p?"selected":""}>Без проекта</option></select>
        ${v.manual||v.demo?`<button class="ib" data-act="editstats">Цифры</button>`:`<button class="ib" data-act="refresh1">Обновить</button>`}
        <a class="ib" href="${esc(v.url)}" target="_blank" rel="noopener">Открыть</a>
        <button class="ib danger" data-act="del">Удалить</button>

function renderStats(){
  const days=S.period==="all"?null:+S.period;
  const from=days? now-days*DAY : -Infinity;
  const vids=S.videos.filter(v=>(v.created||v.added)>=from);
  const inc=vids.reduce((a,v)=>a+incomeUSD(v),0), views=vids.reduce((a,v)=>a+v.stats.views,0);
  const avgEr = views? vids.reduce((a,v)=>a+er(v.stats)*v.stats.views,0)/views : 0;
  // корзины
  let bucket = !days? "month" : days<=30? "day" : "week";
  const start = days? new Date(from) : new Date(Math.min(...S.videos.map(v=>v.created||v.added),now));
  const keys=[]; const labelOf=[];
  const d0=new Date(start); d0.setHours(0,0,0,0);
  if(bucket==="month"){ d0.setDate(1); }
  if(bucket==="week"){ d0.setDate(d0.getDate()-((d0.getDay()+6)%7)); }
  const cur=new Date(d0); let guard=0;
  while(cur.getTime()<=now && guard++<400){ keys.push(cur.getTime()); labelOf.push(bucket==="month"? cur.toLocaleDateString("ru-RU",{month:"short"}) : cur.toLocaleDateString("ru-RU",{day:"numeric",month:"numeric"}));
    if(bucket==="day") cur.setDate(cur.getDate()+1); else if(bucket==="week") cur.setDate(cur.getDate()+7); else cur.setMonth(cur.getMonth()+1); }
  const vals=keys.map(()=>0);
  vids.forEach(v=>{ const t=v.created||v.added; let k=keys.length-1; while(k>0&&keys[k]>t) k--; vals[k]+= S.chartMode==="money"? incomeUSD(v) : v.stats.views; });
  const byProj=S.projects.map(p=>({p,inc:vids.filter(v=>v.projectId===p.id).reduce((a,v)=>a+incomeUSD(v),0),views:vids.filter(v=>v.projectId===p.id).reduce((a,v)=>a+v.stats.views,0),n:vids.filter(v=>v.projectId===p.id).length})).sort((a,b)=>b.inc-a.inc);
  const maxP=Math.max(...byProj.map(x=>x.inc),0.0001);
  const st=(k)=>vids.filter(v=>v.status===k).reduce((a,v)=>a+incomeUSD(v),0);
  const top=[...vids].sort((a,b)=>b.stats.views-a.stats.views).slice(0,3);
  app.innerHTML=`${header()}
  <div class="view" style="--dx:16px">
  ${segHTML("period",[["7","7 дн"],["30","30 дн"],["90","90 дн"],["all","Всё"]],S.period)}
  <div class="kgrid">
    <div class="kcard m"><div class="eyebrow">Доход</div><b class="num" data-to="${inc}" data-fmt="money">${money(inc)}</b></div>
    <div class="kcard v"><div class="eyebrow">Просмотры</div><b class="num" data-to="${views}" data-fmt="short">${short(views)}</b></div>
    <div class="kcard"><div class="eyebrow">Видео</div><b class="num" data-to="${vids.length}">${vids.length}</b></div>
    <div class="kcard"><div class="eyebrow">Средний ER</div><b class="num" data-to="${avgEr}" data-fmt="pct">${nf(avgEr,1)}%</b></div>
  </div>
  <div class="panel"><h3><span>${S.chartMode==="money"?"Доход":"Просмотры"} по ${bucket==="day"?"дням":bucket==="week"?"неделям":"месяцам"}</span>${segHTML("chart",[["money","Доход"],["views","Просм."]],S.chartMode)}</h3>
    ${chartSVG(vals,labelOf)}
  </div>
  <div class="panel"><h3><span>По проектам</span></h3>
    ${byProj.length? byProj.map((x,i)=>`<div class="hbar"><span>${esc(x.p.name)}</span><span class="num">${money(x.inc)}</span><div class="track"><div class="fill" style="width:${Math.max(2,x.inc/maxP*100)}%;background:${x.p.color||PALETTE[i%6]};animation-delay:${i*80}ms"></div></div><span class="meta" style="grid-column:1/-1">${x.n} видео · ${short(x.views)} просм.</span></div>`).join("") : `<div class="meta">Проектов пока нет</div>`}
  </div>
  <div class="panel"><h3><span>По статусам</span></h3>
    <div class="split" style="margin-top:0">
      <div><span>Не подано</span><b>${money(st("none"))}</b></div>
      <div class="s-sub"><span>На выплате</span><b>${money(st("submitted"))}</b></div>
      <div class="s-paid"><span>Оплачено</span><b>${money(st("paid"))}</b></div>
    </div>
  </div>
  ${top.length?`<div class="panel"><h3><span>Лучшие видео периода</span></h3>${top.map((v,i)=>`<div class="hbar"><span>${i+1}. ${esc(v.title)}</span><span class="num">${short(v.stats.views)}</span></div>`).join("")}</div>`:""}
  <p class="note">Период считается по дате публикации видео. Просмотры — текущие, на момент последнего обновления.</p>
  </div>`;
}
function chartSVG(vals,labels){
  const W=340,H=170,pl=44,pb=22,pt=10,pr=6, n=vals.length||1;
  const max=Math.max(...vals,0);
  const nice=(m)=>{ if(m<=0) return 1; const e=Math.pow(10,Math.floor(Math.log10(m))); const f=m/e; return (f<=1?1:f<=2?2:f<=5?5:10)*e; };
  const isMoney=S.chartMode==="money"; const k=isMoney&&S.currency==="RUB"?fxRate():1;
  const top=nice(max*k)/k;
  const ih=H-pb-pt, iw=W-pl-pr, bw=iw/n;
  const y=(v)=>pt+ih-(v/top)*ih;
  let g="";
  for(let i=0;i<=4;i++){ const v=top*i/4, yy=y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1" ${i?'stroke-dasharray="2 4"':""}/><text x="${pl-6}" y="${yy+3.5}" text-anchor="end" font-size="9" fill="var(--faint)" font-family="JetBrains Mono,monospace">${isMoney?(S.currency==="USD"?"$"+short(v):short(v*k)):short(v)}</text>`; }
  const step=Math.ceil(n/7);
  const bars=vals.map((v,i)=>{ const h=Math.max(v>0?2:0,(v/top)*ih), x=pl+i*bw+bw*0.18, w=Math.max(2,bw*0.64);
    const lab = (i%step===0||i===n-1)? `<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--faint)" font-family="Manrope,sans-serif">${labels[i]}</text>`:"";
    return `<rect class="bar" style="animation-delay:${i*18}ms" x="${x}" y="${pt+ih-h}" width="${w}" height="${h}" rx="${Math.min(4,w/2)}" fill="${isMoney?"var(--money)":"var(--views)"}" opacity="${i===n-1?1:.8}"><title>${labels[i]}: ${isMoney?money(v):nf(v)}</title></rect>${lab}`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График">${g}${bars}</svg>`;
}

  if(t.dataset.delacc){ if(t.dataset.sure){ S.accounts.splice(+t.dataset.delacc,1); save(); closeSheet(); render(); toast("Аккаунт удалён. Его видео остались в списке"); } else { t.dataset.sure="1"; t.textContent="Точно удалить? Нажми ещё раз"; } return; }
  if(t.dataset.editproj){ projSheet(t.dataset.editproj); return; }
  if(t.dataset.delproj){ const id=t.dataset.delproj; if(t.dataset.sure){ S.projects=S.projects.filter(p=>p.id!==id); S.videos.forEach(x=>{if(x.projectId===id)x.projectId="";}); if(S.filter===id)S.filter="all"; save(); closeSheet(); render(); toast("Проект удалён"); } else { t.dataset.sure="1"; t.textContent="Точно удалить? Нажми ещё раз"; } return; }
  switch(t.dataset.act){
    case "toggle": openId = openId===v.id? null : v.id; card.classList.toggle("open", openId===v.id); document.querySelectorAll(".vid.open").forEach(c=>{ if(c!==card) c.classList.remove("open"); }); t.setAttribute("aria-expanded", openId===v.id); haptic("light"); break;
    case "refresh": refreshAll(); break;
    case "refresh1": t.textContent="…"; try{ const d=await fetchTT(v.url); v.stats=d.stats; v.tid=v.tid||String(d.id||""); v.updated=Date.now(); save(); render(); haptic("ok"); toast("Статистика обновлена"); }catch(x){ t.textContent="Обновить"; toast("Не удалось обновить, попробуй позже"); } break;
    case "del": if(t.dataset.sure){ S.videos=S.videos.filter(x=>x.id!==v.id); save(); render(); toast("Видео удалено"); } else { t.dataset.sure="1"; t.textContent="Точно?"; } break;
    case "editstats": openSheet(`<h3>Цифры видео</h3><form id="eF">${statFields(v.stats)}<button class="btn" type="submit">Сохранить</button></form>`); $("#eF").onsubmit=(ev)=>{ev.preventDefault(); v.stats=readStats(); v.updated=Date.now(); save(); closeSheet(); render();}; break;
    case "manual": addSheet(true); break;
    case "cleardemo": clearDemo(); save(); render(); break;
    case "fxtoggle": S.fx.useCustom=!S.fx.useCustom; if(S.fx.useCustom&&!S.fx.custom) S.fx.custom=S.fx.auto||92; save(); render(); break;
    case "fxreload": t.textContent="Загружаю…"; await loadFx(); toast(S.fx.auto?"Курс ЦБ: "+nf(S.fx.auto,2)+" ₽":"Не удалось загрузить курс"); render(); break;
    case "newproj": projSheet(null); break;
    case "addacc": accSheet(null); break;
    case "importnow": importAccounts(false); break;
    case "copyid": try{ await navigator.clipboard.writeText(String(USER.id)); toast("ID скопирован"); }catch(x){ const r=document.createRange(); r.selectNodeContents($("#tgid")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Выдели и скопируй"); } break;
    case "syncnow": syncState="pending"; updSync(); await pushCloud(); toast(syncState==="ok"?"Сохранено в облаке":"Не получилось, попробуй позже"); break;
    case "backup": { const txt=JSON.stringify({projects:S.projects,videos:S.videos,fx:S.fx}); try{ await navigator.clipboard.writeText(txt); toast("Копия скопирована"); }catch(x){ openSheet(`<h3>Резервная копия</h3><textarea class="inp" rows="6" readonly id="bk">${esc(txt)}</textarea><p class="note">Выдели текст и скопируй.</p>`); $("#bk").select(); } break; }
    case "restore": openSheet(`<h3>Вставить копию</h3><form id="rF"><textarea class="inp" rows="6" id="rT" placeholder="Вставь сюда текст копии"></textarea><div class="err" id="rE" hidden></div><button class="btn" style="margin-top:10px" type="submit">Восстановить</button></form>`);
      $("#rF").onsubmit=(ev)=>{ev.preventDefault(); try{ const d=JSON.parse($("#rT").value); if(!Array.isArray(d.videos)) throw 0; S.projects=d.projects||[]; S.videos=d.videos; if(d.fx) S.fx=d.fx; S.demo=false; S.filter="all"; save(); closeSheet(); render(); toast("Данные восстановлены"); }catch(x){ const r=$("#rE"); r.hidden=false; r.textContent="Это не похоже на копию из приложения. Скопируй её заново."; } }; break;
  }
});
document.addEventListener("change",(e)=>{
  if(e.target.matches("[data-proj]")){ const v=S.videos.find(x=>x.id===e.target.closest(".vid").dataset.id); v.projectId=e.target.value; save(); render(); }
  if(e.target.id==="fxc"){ const n=+String(e.target.value).replace(",","."); if(n>0){ S.fx.custom=n; save(); render(); toast("Курс сохранён: "+nf(n,2)+" ₽"); } }
});
$("#fab").onclick=()=>{ haptic("medium"); addSheet(false); };
window.addEventListener("resize",placePills);
document.fonts && document.fonts.ready.then(placePills);

applyTheme();
render();
loadFx();
if(CLOUD) pullCloud(); else autoImport();
})();
</script>
